name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build stripped binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          BIN="dist/touchzones-linux-${{ matrix.goarch }}"
          go build -trimpath -ldflags="-s -w" -o "${BIN}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: touchzones-linux-${{ matrix.goarch }}
          path: dist/touchzones-linux-${{ matrix.goarch }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum touchzones-linux-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/touchzones-linux-amd64
            dist/touchzones-linux-arm64
            dist/checksums.txt
          generate_release_notes: true
